<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库连接测试</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px}pre{background:#f4f4f5;padding:16px;border-radius:8px;white-space:pre-wrap;word-break:break-all}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body>
<h2>数据库连接测试（临时诊断页）</h2>
<pre id="out">测试中…</pre>
<script>
(async function(){
  var out = document.getElementById('out');
  out.textContent = '';
  function log(s){ out.textContent += s + "\n"; }
  var URL = 'https://arvpykrfraabwbnwlgje.supabase.co';
  var KEY = 'sb_publishable_TjINRMrM7lD8E-BIcaOlRg_-gJznHwL';

  // 测试1：原生 fetch + 简单查询
  try {
    var r1 = await fetch(URL + '/rest/v1/jobs?select=id&is_active=eq.true&limit=5', {headers: {'apikey': KEY}});
    var j1 = await r1.json();
    log('测试1 原生fetch简单查询: HTTP ' + r1.status + ', 行数=' + (Array.isArray(j1) ? j1.length : '?'));
  } catch(e){ log('测试1 失败: ' + e.name + ': ' + e.message); }

  // 测试2：原生 fetch + 网站完整查询
  try {
    var q2 = '/rest/v1/jobs?select=*&is_active=eq.true&order=posted_at.desc.nullslast&order=discovered_at.desc&limit=500';
    var r2 = await fetch(URL + q2, {headers: {'apikey': KEY}});
    var t2 = await r2.text();
    var j2;
    try { j2 = JSON.parse(t2); } catch(pe){ j2 = null; }
    log('测试2 原生fetch完整查询: HTTP ' + r2.status + ', 长度=' + t2.length + ', 行数=' + (Array.isArray(j2) ? j2.length : '解析失败'));
    if (t2.length < 300) log('   内容: ' + t2.slice(0,300));
  } catch(e){ log('测试2 失败: ' + e.name + ': ' + e.message); }

  // 测试3：supabase-js 客户端 + 网站完整查询
  try {
    if (typeof window.supabase === 'undefined') {
      log('测试3 supabase-js: CDN 脚本未加载！window.supabase 不存在');
    } else {
      var sb = window.supabase.createClient(URL, KEY);
      var res = await sb.from('jobs').select('*').eq('is_active', true)
        .order('posted_at', { ascending: false, nullsFirst: false })
        .order('discovered_at', { ascending: false }).limit(500);
      log('测试3 supabase-js查询: error=' + JSON.stringify(res.error) + ', 行数=' + (res.data ? res.data.length : 'null'));
    }
  } catch(e){ log('测试3 失败: ' + e.name + ': ' + e.message); }
  log('测试完成');
})();
</script>
</body></html>
