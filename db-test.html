<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>诊断 v4</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px}pre{background:#f4f4f5;padding:16px;border-radius:8px;white-space:pre-wrap;word-break:break-all}</style>
</head><body>
<h2>诊断 v4（临时页）</h2>
<pre id="out">测试中…</pre>
<script>
(async function(){
  var out = document.getElementById('out');
  out.textContent = '';
  function log(s){ out.textContent += s + "\n"; }

  // 拦截 fetch，记录 supabase-js 发出的请求和收到的响应
  var origFetch = window.fetch;
  var calls = [];
  window.fetch = async function(url, opts){
    var rec = {url: String(url).slice(0, 160), reqHeaders: {}, status: null, bodyLen: null, bodyStart: null, err: null};
    try {
      var h = (opts && opts.headers) || {};
      if (h instanceof Headers) { h.forEach(function(v,k){ rec.reqHeaders[k] = String(v).slice(0,40); }); }
      else { for (var k in h) rec.reqHeaders[k] = String(h[k]).slice(0,40); }
      var resp = await origFetch(url, opts);
      rec.status = resp.status;
      var clone = resp.clone();
      var txt = await clone.text();
      rec.bodyLen = txt.length;
      rec.bodyStart = txt.slice(0, 200);
      calls.push(rec);
      return resp;
    } catch(e){
      rec.err = e.name + ': ' + e.message;
      calls.push(rec);
      throw e;
    }
  };

  await new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = 'https://rutie1.github.io/job-hunt/vendor/supabase-js-2.117.2.min.js?t=' + Date.now();
    s.onload = resolve; s.onerror = function(){ reject(new Error('脚本加载失败')); };
    document.head.appendChild(s);
  });

  var sb = window.supabase.createClient(
    'https://arvpykrfraabwbnwlgje.supabase.co',
    'sb_publishable_TjINRMrM7lD8E-BIcaOlRg_-gJznHwL');
  var res = await sb.from('jobs').select('*').eq('is_active', true)
    .order('posted_at', { ascending: false, nullsFirst: false })
    .order('discovered_at', { ascending: false }).limit(500);

  log('supabase-js 结果: error=' + JSON.stringify(res.error) + ', 行数=' + (res.data ? res.data.length : 'null'));
  log('--- 拦截到的请求 (' + calls.length + ' 个) ---');
  calls.forEach(function(c, i){
    log('[' + i + '] ' + c.url);
    log('    请求头: ' + JSON.stringify(c.reqHeaders));
    log('    状态: ' + c.status + ', 响应长度: ' + c.bodyLen + (c.err ? ', 错误: ' + c.err : ''));
    if (c.bodyStart) log('    响应开头: ' + c.bodyStart);
  });
  log('完成');
})();
</script>
</body></html>
