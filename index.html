<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>铁胖的个人空间</title>
<link rel="icon" href="icon.svg?v=20261004o" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png?v=20261004o">
<link rel="manifest" href="manifest.json?v=20261004o">
<meta name="theme-color" content="#F6F1E7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="铁胖空间">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261004o">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js?v=20261004o').catch(function(){});
  });
}
</script>
</head>
<body>

<!-- 未登录 -->
<div id="login-view" class="login-wrap" hidden>
  <div class="login-card">
    <img src="icon.svg?v=20261004o" alt="" class="login-icon">
    <h1>铁胖的个人空间</h1>
    <p class="hint">私人空间，仅本人登录后可见。</p>
    <input id="login-email" type="email" placeholder="邮箱" autocomplete="username">
    <input id="login-pass" type="password" placeholder="密码" autocomplete="current-password">
    <button id="login-btn" class="btn primary">登录</button>
    <p id="login-err" class="err" hidden></p>
  </div>
</div>

<!-- 已登录 -->
<div id="app-view" hidden>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg?v=20261004o" alt="" class="brand-icon">
      <span class="brand-name">铁胖的个人空间</span>
    </div>
    <button id="logout-btn" class="btn small">退出</button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="tab-today" class="active">今日</button>
    <button data-tab="tab-todos">待办</button>
    <button data-tab="tab-health">健康</button>
    <button data-tab="tab-market">市场</button>
    <button data-tab="tab-mail">邮箱</button>
    <button data-tab="tab-links">链接</button>
  </nav>

  <main id="app">
    <section id="tab-today" class="tab-panel active">
      <div class="hero">
        <p class="hero-greet"><span class="dot"></span><span id="greeting"></span></p>
        <div class="hero-clock-row">
          <span class="hero-clock num" id="hero-clock">--:--</span>
          <span class="hero-date" id="today-date"></span>
        </div>
        <div><span class="hero-focus" id="hero-focus" hidden></span></div>
      </div>
      <div class="stat-strip" id="stat-strip"></div>
      <div class="bento" id="today-bento"></div>
    </section>

    <section id="tab-todos" class="tab-panel">
      <div class="sec-head sec-todos-s"><span class="dot"></span><h2>待办</h2><span class="sub">行程和事项，一处搞定</span></div>
      <div class="mini-label">即将到来的行程</div>
      <div id="trips-list" class="cards" style="margin-bottom:16px;"></div>
      <div class="mini-label">事项清单</div>
      <form id="todo-form" class="form-card">
        <h3>新增待办</h3>
        <input name="title" placeholder="要做什么 *" required>
        <input name="due_date" type="date" aria-label="截止日期">
        <button type="submit" class="btn primary">添加</button>
      </form>
      <div class="toolbar"><button id="todos-refresh" class="btn small">刷新</button></div>
      <div id="todos-list"></div>
    </section>

    <section id="tab-health" class="tab-panel">
      <div class="sec-head sec-health-s"><span class="dot"></span><h2>健康</h2><span class="sub">身体是本钱</span></div>
      <form id="health-form" class="form-card">
        <h3>记录一下</h3>
        <div class="row">
          <select name="kind" aria-label="类型">
            <option value="weight">体重</option>
            <option value="workout">运动</option>
            <option value="meal">饮食</option>
            <option value="other">其他</option>
          </select>
          <input name="log_date" type="date" id="health-date" aria-label="日期">
        </div>
        <input name="value_text" placeholder="内容，比如：72.5kg / 跑步5km / 买菜" required>
        <button type="submit" class="btn primary">记录</button>
      </form>
      <div class="toolbar"><button id="health-refresh" class="btn small">刷新</button></div>
      <div id="health-list"></div>
    </section>

    <section id="tab-market" class="tab-panel">
      <div class="sec-head sec-market-s"><span class="dot"></span><h2>市场</h2><span class="sub">每天 7:50 自动更新</span></div>
      <div class="toolbar"><button id="market-refresh" class="btn small">刷新</button></div>
      <div id="market-list" class="cards"></div>
    </section>

    <section id="tab-mail" class="tab-panel">
      <div class="sec-head sec-mail-s"><span class="dot"></span><h2>邮箱</h2><span class="sub">重要的事，别错过</span></div>
      <p class="hint">每天自动扫描 Gmail，重要的事列在这里。只读摘要，不碰正文细节。</p>
      <div class="toolbar"><button id="mail-refresh" class="btn small">刷新</button></div>
      <div id="mail-list" class="cards"></div>
    </section>

    <section id="tab-links" class="tab-panel">
      <div class="sec-head sec-links-s"><span class="dot"></span><h2>链接</h2><span class="sub">常用直达</span></div>
      <div class="toolbar"><button id="links-refresh" class="btn small">刷新</button></div>
      <div id="links-list"></div>
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>
<script src="app.js?v=20261004o"></script>
</body>
</html>
